<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>門市排班系統 v2.9</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

:root {
  --bg: #0f1117;
  --bg2: #181b24;
  --bg3: #1e222e;
  --bg4: #262b3a;
  --text: #e8eaf0;
  --text2: #9aa0b4;
  --text3: #636a80;
  --accent: #5b8def;
  --accent2: #4a7de0;
  --store1: #5b8def;
  --store1bg: rgba(91,141,239,0.12);
  --store2: #e8a84c;
  --store2bg: rgba(232,168,76,0.12);
  --store3: #6fcf97;
  --store3bg: rgba(111,207,151,0.12);
  --store4: #a78bfa;
  --store4bg: rgba(167,139,250,0.12);
  --store5: #f472b6;
  --store5bg: rgba(244,114,182,0.12);
  --store6: #22d3ee;
  --store6bg: rgba(34,211,238,0.12);
  --store7: #fb923c;
  --store7bg: rgba(251,146,60,0.12);
  --store8: #a3e635;
  --store8bg: rgba(163,230,53,0.12);
  --danger: #ef5b5b;
  --dangerbg: rgba(239,91,91,0.1);
  --warn: #e8a84c;
  --warnbg: rgba(232,168,76,0.1);
  --success: #6fcf97;
  --successbg: rgba(111,207,151,0.1);
  --border: rgba(255,255,255,0.06);
  --shadow: 0 2px 12px rgba(0,0,0,0.3);
  --radius: 10px;
}

body.light-mode {
  --bg: #f4f5f7;
  --bg2: #ffffff;
  --bg3: #eef0f4;
  --bg4: #e2e5ec;
  --text: #1a1d2e;
  --text2: #4a5068;
  --text3: #8b90a8;
  --accent: #3a6fd8;
  --accent2: #2f5ec4;
  --store1: #3a6fd8;
  --store1bg: rgba(58,111,216,0.10);
  --store2: #c47d1a;
  --store2bg: rgba(196,125,26,0.10);
  --store3: #2a9b63;
  --store3bg: rgba(42,155,99,0.10);
  --store4: #7c3aed;
  --store4bg: rgba(124,58,237,0.10);
  --store5: #db2777;
  --store5bg: rgba(219,39,119,0.10);
  --store6: #0891b2;
  --store6bg: rgba(8,145,178,0.10);
  --store7: #ea580c;
  --store7bg: rgba(234,88,12,0.10);
  --store8: #65a30d;
  --store8bg: rgba(101,163,13,0.10);
  --danger: #d63838;
  --dangerbg: rgba(214,56,56,0.09);
  --warn: #c47d1a;
  --warnbg: rgba(196,125,26,0.09);
  --success: #2a9b63;
  --successbg: rgba(42,155,99,0.09);
  --border: rgba(0,0,0,0.08);
  --shadow: 0 2px 12px rgba(0,0,0,0.1);
}

/* Theme toggle button */
.theme-toggle {
  display:flex; align-items:center; gap:6px;
  padding:7px 14px; border-radius:20px; font-size:12px; font-weight:500;
  cursor:pointer; border:1px solid var(--border);
  background:var(--bg3); color:var(--text2);
  transition:all .25s; font-family:inherit;
  white-space:nowrap;
}
.theme-toggle:hover { background:var(--bg4); color:var(--text); }
.theme-toggle .toggle-icon { font-size:15px; transition:transform .3s; }
body.light-mode .theme-toggle .toggle-icon { transform:rotate(180deg); }

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: 'Noto Sans TC', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* Scrollbar */
::-webkit-scrollbar { width:6px; height:6px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--bg4); border-radius:3px; }

/* Layout */
.app { max-width:1440px; margin:0 auto; padding:20px; }

.header {
  display:flex; align-items:center; justify-content:space-between;
  padding:16px 0 24px; border-bottom:1px solid var(--border); margin-bottom:24px;
}
.header h1 {
  font-size:22px; font-weight:600; letter-spacing:-0.5px;
  display:flex; align-items:center; gap:10px;
}
.header h1 span { color:var(--accent); }
.header-actions { display:flex; gap:8px; }

/* Tabs */
.tabs {
  display:flex; gap:4px; background:var(--bg2); border-radius:var(--radius);
  padding:4px; margin-bottom:24px; width:fit-content;
}
.tab {
  padding:8px 20px; border-radius:8px; cursor:pointer;
  font-size:13px; font-weight:500; color:var(--text2);
  transition:all .2s; border:none; background:none;
}
.tab:hover { color:var(--text); }
.tab.active { background:var(--bg4); color:var(--text); }

/* Cards */
.card {
  background:var(--bg2); border:1px solid var(--border);
  border-radius:var(--radius); padding:20px; margin-bottom:16px;
}
.card-title {
  font-size:14px; font-weight:600; margin-bottom:16px;
  display:flex; align-items:center; gap:8px;
}
.card-title .dot { width:8px; height:8px; border-radius:50%; }

/* Grid layout */
.grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.grid-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px; }
.grid-4 { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }

/* Form elements */
label { font-size:12px; color:var(--text2); margin-bottom:4px; display:block; }
input, select {
  width:100%; padding:8px 12px; background:var(--bg3); border:1px solid var(--border);
  border-radius:6px; color:var(--text); font-size:13px; font-family:inherit;
  outline:none; transition:border .2s;
}
input:focus, select:focus { border-color:var(--accent); }
input[type="number"] { font-family:'JetBrains Mono', monospace; }

.btn {
  padding:8px 16px; border-radius:6px; font-size:13px; font-weight:500;
  cursor:pointer; border:none; transition:all .2s; font-family:inherit;
  display:inline-flex; align-items:center; gap:6px;
}
.btn-primary { background:var(--accent); color:#fff; }
.btn-primary:hover { background:var(--accent2); }
.btn-ghost { background:transparent; color:var(--text2); border:1px solid var(--border); }
.btn-ghost:hover { background:var(--bg3); color:var(--text); }
.btn-danger { background:var(--dangerbg); color:var(--danger); }
.btn-danger:hover { background:rgba(239,91,91,0.2); }
.btn-sm { padding:5px 10px; font-size:12px; }
.btn-lg { padding:10px 24px; font-size:14px; }

/* Tags */
.tag {
  display:inline-flex; align-items:center; padding:3px 10px;
  border-radius:20px; font-size:11px; font-weight:500;
}
.tag-store1 { background:var(--store1bg); color:var(--store1); }
.tag-store2 { background:var(--store2bg); color:var(--store2); }
.tag-store3 { background:var(--store3bg); color:var(--store3); }
.tag-store4 { background:var(--store4bg); color:var(--store4); }
.tag-store5 { background:var(--store5bg); color:var(--store5); }
.tag-store6 { background:var(--store6bg); color:var(--store6); }
.tag-store7 { background:var(--store7bg); color:var(--store7); }
.tag-store8 { background:var(--store8bg); color:var(--store8); }

/* Table */
table { width:100%; border-collapse:collapse; }
th {
  text-align:left; padding:10px 12px; font-size:11px; font-weight:600;
  color:var(--text3); text-transform:uppercase; letter-spacing:0.5px;
  border-bottom:1px solid var(--border);
}
td {
  padding:8px 12px; font-size:13px; border-bottom:1px solid var(--border);
}
tr:hover td { background:rgba(255,255,255,0.02); }

/* Schedule Grid */
.schedule-grid {
  display:grid; gap:0; overflow-x:auto; font-size:12px;
}
.sg-header {
  position:sticky; top:0; background:var(--bg2); z-index:2;
  display:contents;
}
.sg-cell {
  padding:6px 8px; border:1px solid var(--border);
  min-width:44px; text-align:center; font-size:11px;
  transition:background .15s;
}
.sg-cell.header-cell {
  background:var(--bg3); font-weight:600; color:var(--text2);
  position:sticky; top:0; z-index:2;
}
.sg-cell.name-cell {
  background:var(--bg3); font-weight:500; text-align:left;
  position:sticky; left:0; z-index:3; min-width:80px;
  white-space:nowrap;
}
.sg-cell.name-cell.header-cell { z-index:4; }
.sg-cell.available { background:rgba(111,207,151,0.08); cursor:pointer; }
.sg-cell.available:hover { background:rgba(111,207,151,0.18); }
.sg-cell.assigned {
  font-weight:600; cursor:pointer;
}
.sg-cell.assigned.store1 { background:var(--store1bg); color:var(--store1); }
.sg-cell.assigned.store2 { background:var(--store2bg); color:var(--store2); }
.sg-cell.assigned.store3 { background:var(--store3bg); color:var(--store3); }
.sg-cell.assigned.store4 { background:var(--store4bg); color:var(--store4); }
.sg-cell.assigned.store5 { background:var(--store5bg); color:var(--store5); }
.sg-cell.assigned.store6 { background:var(--store6bg); color:var(--store6); }
.sg-cell.assigned.store7 { background:var(--store7bg); color:var(--store7); }
.sg-cell.assigned.store8 { background:var(--store8bg); color:var(--store8); }
.sg-cell.unavailable { background:var(--bg); color:var(--text3); }
.sg-cell.conflict { background:var(--dangerbg); color:var(--danger); }

.sg-cell .shift-label { font-size:10px; }

/* Day of week colors */
.dow-sat { color:var(--store2); }
.dow-sun { color:var(--danger); }

/* Modal */
.modal-overlay {
  position:fixed; top:0; left:0; right:0; bottom:0;
  background:rgba(0,0,0,0.6); backdrop-filter:blur(4px);
  z-index:100; display:flex; align-items:center; justify-content:center;
  animation:fadeIn .2s;
}
.modal {
  background:var(--bg2); border:1px solid var(--border);
  border-radius:12px; padding:24px; min-width:420px; max-width:90vw;
  max-height:85vh; overflow-y:auto; animation:slideUp .25s;
}
.modal h2 { font-size:16px; font-weight:600; margin-bottom:16px; }
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
@keyframes slideUp { from{transform:translateY(20px);opacity:0} to{transform:translateY(0);opacity:1} }

/* Availability checkbox grid */
.avail-grid {
  display:grid; grid-template-columns:auto repeat(7,1fr);
  gap:2px; font-size:11px;
}
.avail-grid .ag-header { font-weight:600; color:var(--text2); text-align:center; padding:4px; }
.avail-grid .ag-week { color:var(--text3); padding:4px; text-align:right; font-size:10px; }
.avail-grid .ag-cell {
  width:32px; height:28px; border-radius:4px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition:all .15s; font-size:10px;
}
.avail-grid .ag-cell.on { background:var(--successbg); color:var(--success); }
.avail-grid .ag-cell.off { background:var(--bg); color:var(--text3); }
.avail-grid .ag-cell:hover { opacity:0.8; }

/* Stats bar */
.stats-bar {
  display:flex; gap:16px; flex-wrap:wrap; margin-bottom:20px;
}
.stat-item {
  background:var(--bg2); border:1px solid var(--border);
  border-radius:var(--radius); padding:14px 20px; flex:1; min-width:150px;
}
.stat-value {
  font-size:24px; font-weight:700; font-family:'JetBrains Mono', monospace;
}
.stat-label { font-size:11px; color:var(--text2); margin-top:2px; }

/* Print */
@media print {
  body { background:#fff; color:#000; }
  .no-print { display:none !important; }
  .card { border:1px solid #ddd; }
  .sg-cell.assigned.store1,
  .sg-cell.assigned.store2,
  .sg-cell.assigned.store3,
  .sg-cell.assigned.store4,
  .sg-cell.assigned.store5,
  .sg-cell.assigned.store6,
  .sg-cell.assigned.store7,
  .sg-cell.assigned.store8 { color:#000 !important; }
}

/* Tooltip */
.tooltip {
  position:relative;
}
.tooltip::after {
  content:attr(data-tip); position:absolute; bottom:100%; left:50%;
  transform:translateX(-50%); padding:4px 8px; background:var(--bg4);
  border-radius:4px; font-size:11px; white-space:nowrap;
  opacity:0; pointer-events:none; transition:opacity .2s;
}
.tooltip:hover::after { opacity:1; }

/* Violation badge */
.violation {
  display:inline-flex; align-items:center; gap:4px;
  padding:3px 8px; border-radius:4px; font-size:11px;
  background:var(--dangerbg); color:var(--danger);
}

/* Section */
.section { margin-bottom:24px; }
.section-title {
  font-size:13px; font-weight:600; color:var(--text2);
  margin-bottom:12px; text-transform:uppercase; letter-spacing:0.5px;
}

/* Checkbox */
.checkbox-row {
  display:flex; align-items:center; gap:8px; padding:4px 0;
}
.checkbox-row input[type="checkbox"] {
  width:16px; height:16px; accent-color:var(--accent);
}

/* Store config row */
.store-config-row {
  display:flex; align-items:center; gap:12px; padding:10px 0;
  border-bottom:1px solid var(--border);
}
.store-config-row:last-child { border:none; }

.toggle-group {
  display:flex; gap:2px; background:var(--bg); border-radius:6px; padding:2px;
}
.toggle-opt {
  padding:4px 12px; border-radius:4px; font-size:11px;
  cursor:pointer; transition:all .2s; color:var(--text3);
  border:none; background:none; font-family:inherit;
}
.toggle-opt.active { background:var(--bg4); color:var(--text); }

/* Person list in sidebar */
.person-row {
  display:flex; align-items:center; gap:8px; padding:8px 10px;
  border-radius:6px; cursor:pointer; transition:background .15s;
}
.person-row:hover { background:var(--bg3); }
.person-avatar {
  width:28px; height:28px; border-radius:50%; background:var(--bg4);
  display:flex; align-items:center; justify-content:center;
  font-size:11px; font-weight:600;
}
.person-name { font-size:13px; flex:1; }
.person-shifts { font-size:11px; color:var(--text3); font-family:'JetBrains Mono', monospace; }

/* Two column layout */
.layout-main {
  display:grid; grid-template-columns:260px 1fr; gap:20px;
}
@media(max-width:900px) { .layout-main { grid-template-columns:1fr; } }

/* Shift cell content */
.shift-content {
  display:flex; flex-direction:column; align-items:center; gap:1px;
}
.shift-store { font-weight:700; font-size:11px; }
.shift-type { font-size:9px; opacity:0.7; }

/* Quick actions */
.quick-actions {
  display:flex; gap:6px; flex-wrap:wrap; margin-top:8px;
}

/* empty state */
.empty-state {
  text-align:center; padding:40px; color:var(--text3);
}
.empty-state .icon { font-size:32px; margin-bottom:8px; }

/* Conflict pair */
.conflict-pair {
  display:flex; align-items:center; gap:10px; padding:10px 14px;
  background:var(--bg3); border-radius:8px; border-left:3px solid var(--danger);
}
.conflict-pair .names {
  flex:1; font-size:13px; font-weight:500;
}
.conflict-pair .vs {
  color:var(--danger); font-size:11px; font-weight:700; padding:0 4px;
}
.conflict-add-row {
  display:flex; gap:8px; align-items:flex-end;
}
.conflict-add-row select {
  flex:1;
}

/* Legend */
.legend {
  display:flex; gap:16px; flex-wrap:wrap; font-size:11px; color:var(--text2);
  padding:8px 0;
}
.legend-item { display:flex; align-items:center; gap:4px; }
.legend-dot {
  width:12px; height:12px; border-radius:3px;
}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
// ============================================================
// DATA MODEL
// ============================================================

const DEFAULT_STORES = [
  { id:'taipei', name:'台北車站', short:'北車', color:'store1' },
  { id:'zhongshan', name:'中山誠品', short:'中山', color:'store2' },
  { id:'songyan', name:'松菸誠品', short:'松菸', color:'store3' },
];

// Color palette for dynamic stores (dark / light hex values)
const COLOR_MAP = {
  store1: { dark:{ main:'#5b8def', bg:'rgba(91,141,239,0.18)',   text:'#b8d0ff' }, light:{ main:'#3a6fd8', bg:'rgba(58,111,216,0.13)',   text:'#1a3a7a' } },
  store2: { dark:{ main:'#e8a84c', bg:'rgba(232,168,76,0.18)',   text:'#ffe0a0' }, light:{ main:'#c47d1a', bg:'rgba(196,125,26,0.13)',   text:'#6b3d00' } },
  store3: { dark:{ main:'#6fcf97', bg:'rgba(111,207,151,0.18)',  text:'#b2f0ce' }, light:{ main:'#2a9b63', bg:'rgba(42,155,99,0.13)',    text:'#0d4f30' } },
  store4: { dark:{ main:'#a78bfa', bg:'rgba(167,139,250,0.18)',  text:'#ddd6fe' }, light:{ main:'#7c3aed', bg:'rgba(124,58,237,0.13)',   text:'#4c1d95' } },
  store5: { dark:{ main:'#f472b6', bg:'rgba(244,114,182,0.18)',  text:'#fbcfe8' }, light:{ main:'#db2777', bg:'rgba(219,39,119,0.13)',   text:'#831843' } },
  store6: { dark:{ main:'#22d3ee', bg:'rgba(34,211,238,0.18)',   text:'#a5f3fc' }, light:{ main:'#0891b2', bg:'rgba(8,145,178,0.13)',    text:'#164e63' } },
  store7: { dark:{ main:'#fb923c', bg:'rgba(251,146,60,0.18)',   text:'#fed7aa' }, light:{ main:'#ea580c', bg:'rgba(234,88,12,0.13)',    text:'#7c2d12' } },
  store8: { dark:{ main:'#a3e635', bg:'rgba(163,230,53,0.18)',   text:'#d9f99d' }, light:{ main:'#65a30d', bg:'rgba(101,163,13,0.13)',   text:'#365314' } },
};
const COLOR_PALETTE = ['store1','store2','store3','store4','store5','store6','store7','store8'];

let STORES = [...DEFAULT_STORES];

const SHIFT_TYPES = {
  FULL: { id:'FULL', label:'整日', short:'全' },
  AM:   { id:'AM',   label:'早班', short:'早' },
  PM:   { id:'PM',   label:'晚班', short:'晚' },
};

// 員工身分別。regular=正式員工（可帶新人），new=新進員工，intern=實習生
const ROLES = {
  regular: { id:'regular', label:'正式員工', short:'正職', icon:'🟢', color:'var(--success)', bg:'var(--successbg)' },
  new:     { id:'new',     label:'新進員工', short:'新進', icon:'🔵', color:'var(--accent)',  bg:'var(--store1bg)' },
  intern:  { id:'intern',  label:'實習生',   short:'實習', icon:'🟡', color:'var(--warn)',    bg:'var(--warnbg)' },
};
function empRole(e) { return (e && ROLES[e.role]) ? e.role : 'regular'; }
function roleOfId(id) { const e = state.employees.find(x => x.id === id); return empRole(e); }
// 身分標籤 HTML；size:'sm' 用於排班格的小標
function roleBadge(role, size) {
  const r = ROLES[role] || ROLES.regular;
  if (size === 'sm') {
    return `<span title="${r.label}" style="font-size:8px;padding:0 3px;border-radius:3px;background:${r.bg};color:${r.color};font-weight:600;white-space:nowrap;">${r.short}</span>`;
  }
  return `<span style="font-size:11px;padding:1px 8px;border-radius:10px;background:${r.bg};color:${r.color};font-weight:600;white-space:nowrap;">${r.icon} ${r.label}</span>`;
}

// ── 搭班偏好（buddyPairs）輔助 ──
function buddyIdsOf(id) {
  const out = [];
  for (const [a, b] of (state.buddyPairs || [])) {
    if (a === id) out.push(b);
    else if (b === id) out.push(a);
  }
  return out;
}
function buddyNamesFor(id) {
  return buddyIdsOf(id).map(bid => state.employees.find(e => e.id === bid)?.name || '（已刪除）');
}

const DEFAULT_STATE = {
  year: new Date().getFullYear(),
  month: new Date().getMonth() + 1,
  stores: [...DEFAULT_STORES],
  employees: [],
  storeSettings: {
    taipei:    { defaultShiftType:'FULL', defaultStaff:1, dailyOverrides:{} },
    zhongshan: { defaultShiftType:'FULL', defaultStaff:1, dailyOverrides:{} },
    songyan:   { defaultShiftType:'FULL', defaultStaff:1, dailyOverrides:{} },
  },
  constraints: {
    maxConsecutive: 6,
    defaultMinShifts: 8,
    defaultMaxShifts: 16,
  },
  assignments: {},  // "YYYY-MM-DD_storeId_shiftType": [empId, ...]
  conflictPairs: [], // [[empId1, empId2], ...] 不可同班
  buddyPairs: [],    // [[empId1, empId2], ...] 優先同班（搭班偏好）
  tab: 'schedule',
};

let state = { ...DEFAULT_STATE };
let currentUser = { email: '', name: '' };
let _saveTimer = null;
let _saving = false;
let _lastSaveTime = 0;
let _useLocalFallback = false; // localStorage fallback（僅限本機開發）
let _savePromise = null;       // tracks in-flight API save
let _dirty = false;            // 有變更尚未確認寫入雲端
let _loadingState = false;     // 正在載入雲端資料（切月中），期間禁止儲存
let _pendingForce = false;     // 下一次儲存帶 force=1（清除排班等刻意清空操作）
let _monthMeta = { updatedAt: null, updatedBy: null }; // 目前月份最後更新資訊

// localStorage 降級只允許本機開發環境，正式環境絕不靜默降級
const IS_LOCAL_DEV = ['localhost', '127.0.0.1'].includes(location.hostname);

// ── Store sync ───────────────────────────────────────────────

function syncStores() {
  if (state.stores && state.stores.length > 0) {
    STORES = state.stores;
  } else {
    state.stores = [...DEFAULT_STORES];
    STORES = state.stores;
  }
  // Ensure every store has a storeSettings entry
  for (const s of STORES) {
    if (!state.storeSettings[s.id]) {
      state.storeSettings[s.id] = { defaultShiftType:'FULL', defaultStaff:1, dailyOverrides:{} };
    }
  }
}

// ── API helpers ──────────────────────────────────────────────

function monthKey() {
  return `${state.year}-${String(state.month).padStart(2,'0')}`;
}

// localStorage fallback keys (used when API unavailable)
const LS_GLOBAL = 'shiftScheduler_global';
const LS_MONTH  = (mk) => `shiftScheduler_month_${mk}`;

function loadStateFromLocalStorage() {
  try {
    const globalRaw = localStorage.getItem(LS_GLOBAL);
    const monthRaw  = localStorage.getItem(LS_MONTH(monthKey()));
    const globalData = globalRaw ? JSON.parse(globalRaw) : {};
    const monthData  = monthRaw  ? JSON.parse(monthRaw)  : {};
    const merged = { ...DEFAULT_STATE, ...globalData, ...monthData };
    if (!merged.storeSettings) merged.storeSettings = DEFAULT_STATE.storeSettings;
    if (!merged.constraints)   merged.constraints   = DEFAULT_STATE.constraints;
    if (!merged.assignments)   merged.assignments   = {};
    if (!merged.conflictPairs) merged.conflictPairs = [];
    if (!merged.buddyPairs)    merged.buddyPairs    = [];
    state = merged;
    syncStores();
  } catch(e) {}
}

function saveStateToLocalStorage() {
  try {
    const { assignments, year, month, tab, ...globalPart } = state;
    localStorage.setItem(LS_GLOBAL, JSON.stringify(globalPart));
    localStorage.setItem(LS_MONTH(monthKey()), JSON.stringify({ assignments: assignments || {} }));
  } catch(e) {}
}

// ── 強化版 fetch：驗證回應必須是 JSON ──
// Zero Trust 登入過期時，API 會回傳 Access 登入頁（HTML、狀態碼 200），
// 舊版程式誤判為成功。這裡以 content-type 區分，並分類錯誤型態。
async function apiFetch(url, options = {}) {
  let res;
  try {
    res = await fetch(url, { cache: 'no-store', ...options });
  } catch (e) {
    const err = new Error('網路連線失敗');
    err.kind = 'network';
    throw err;
  }
  const ct = res.headers.get('content-type') || '';
  if (!ct.includes('application/json')) {
    // 收到 HTML → Cloudflare Access 登入頁 → session 已過期
    const err = new Error('登入已逾時');
    err.kind = 'auth';
    throw err;
  }
  const body = await res.json();
  if (!res.ok || body.ok === false) {
    const err = new Error(body.message || body.error || `HTTP ${res.status}`);
    err.kind = (res.status === 409) ? 'blocked' : 'server';
    err.status = res.status;
    throw err;
  }
  return body;
}

  const ov = document.createElement('div');

  ov.innerHTML = `

      <h2 style="font-size:17px;margin-bottom:10px;">登入已逾時</h2>
      <p style="font-size:13px;color:var(--text2);line-height:1.7;margin-bottom:20px;">
        Cloudflare 驗證已過期，目前的變更<b style="color:var(--danger);">無法儲存至雲端</b>。<br>

async function loadState() {
  if (_useLocalFallback) {
    loadStateFromLocalStorage();
    return;
  }
  try {
    const body = await apiFetch(`/api/state?month=${monthKey()}`);
    const data = body.data;
    if (data) {
      if (!data.storeSettings) data.storeSettings = DEFAULT_STATE.storeSettings;
      if (!data.constraints)   data.constraints   = DEFAULT_STATE.constraints;
      if (!data.assignments)   data.assignments   = {};
      if (!data.conflictPairs) data.conflictPairs = [];
      if (!data.buddyPairs)    data.buddyPairs    = [];
      state = { ...DEFAULT_STATE, ...data };
      syncStores();
      _dirty = false; // 剛從雲端載入，狀態是乾淨的
      _monthMeta = { updatedAt: body.monthUpdatedAt || null, updatedBy: body.monthUpdatedBy || null };
    }
  } catch(e) {
    if (e.kind === 'auth') {
      showAuthExpiredModal();
      return;
    }
    if (IS_LOCAL_DEV) {
      // 本機開發沒有 Pages Functions → 允許降級到 localStorage
      _useLocalFallback = true;
      console.warn('API unavailable (local dev), using localStorage fallback:', e.message);
      loadStateFromLocalStorage();
      return;
    }
    // 正式環境載入失敗：保留現有畫面並明確告知，絕不靜默切換資料來源
    console.error('loadState failed:', e);
    showToast(`❌ 雲端資料載入失敗：${e.message}（點擊「🔄 同步」重試）`, 'error', 8000);
    setSaveIndicator('error');
  }
}

async function saveState(opts = {}) {
  if (opts.force) _pendingForce = true;
  _dirty = true;
  if (_useLocalFallback) {
    saveStateToLocalStorage();
    _dirty = false;
    setSaveIndicator('local');
    return;
  }
  // Debounce: coalesce rapid saves into one request 500ms later
  if (_saveTimer) clearTimeout(_saveTimer);
  _saveTimer = setTimeout(async () => {
    _saveTimer = null;
    await _doSaveToAPI();
  }, 500);
}

// Immediately upload state to API (no debounce). Returns a Promise.
async function saveStateImmediate(opts = {}) {
  if (opts.force) _pendingForce = true;
  _dirty = true;
  if (_useLocalFallback) {
    saveStateToLocalStorage();
    _dirty = false;
    setSaveIndicator('local');
    return;
  }
  // Cancel any pending debounced save first
  if (_saveTimer) { clearTimeout(_saveTimer); _saveTimer = null; }
  await _doSaveToAPI();
}

const SAVE_MAX_RETRIES = 3;

async function _doSaveToAPI() {
  if (_loadingState) return;            // 切月載入中不儲存（防止把空班表寫進新月份）
  if (_savePromise) return _savePromise; // 已有儲存進行中，共用同一個 promise
  _saving = true;
  setSaveIndicator('saving');
  setRefreshBtnDisabled(true);
  const p = (async () => {
    try {
      let lastErr = null;
      for (let attempt = 1; attempt <= SAVE_MAX_RETRIES; attempt++) {
        try {
          const forceParam = _pendingForce ? '&force=1' : '';
          const body = await apiFetch(`/api/state?month=${monthKey()}${forceParam}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(state),
          });
          // 到這裡代表後端確認寫入成功（body.ok === true）
          _dirty = false;
          _pendingForce = false;
          _lastSaveTime = Date.now();
          _monthMeta = { updatedAt: body.savedAt, updatedBy: body.savedBy };
          setSaveIndicator('saved');
          showToast('✅ 已儲存至雲端', 'success', 1600);
          return;
        } catch(e) {
          lastErr = e;
          if (e.kind === 'auth') {
            setSaveIndicator('error');
            showAuthExpiredModal();
            return;
          }
          if (e.kind === 'blocked') {
            // 後端阻止了「空資料覆蓋非空資料」
            setSaveIndicator('error');
            if (confirm(`⛔ ${e.message}\n\n確定要以目前內容覆寫雲端資料嗎？\n（按「取消」則放棄這次儲存，建議先按「🔄 同步」拉回雲端資料）`)) {
              _pendingForce = true;
              continue; // 帶 force=1 重試
            }
            return;
          }
          // network / server 錯誤 → 指數退避重試
          if (attempt < SAVE_MAX_RETRIES) {
            await new Promise(r => setTimeout(r, attempt * 1200));
          }
        }
      }
      // 重試全部失敗
      console.error('saveState failed after retries:', lastErr);
      setSaveIndicator('error');
      showToast(`❌ 儲存失敗（已重試 ${SAVE_MAX_RETRIES} 次）：${lastErr.message} — 資料尚未上傳，請勿關閉頁面`, 'error', 0, { retry: true });
    } finally {
      _saving = false;
      _savePromise = null;
      setRefreshBtnDisabled(false);
    }
  })();
  _savePromise = p;
  await p;
}

// ── Toast 提示系統 ──────────────────────────────────────────
// duration 0 = 常駐直到手動關閉；opts.retry = 顯示「重試儲存」按鈕
function showToast(msg, type = 'info', duration = 2500, opts = {}) {
  let box = document.getElementById('toastBox');
  if (!box) {
    box = document.createElement('div');
    box.id = 'toastBox';
    box.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:9998;display:flex;flex-direction:column;gap:8px;align-items:center;max-width:90vw;';
    document.body.appendChild(box);
  }
  // 同類型 toast 不重複堆疊（例如連續儲存成功）
  const existing = box.querySelector(`[data-toast-type="${type}"]`);
  if (existing) existing.remove();

  const colors = {
    success: 'background:#1a2e1e;border:1px solid rgba(111,207,151,0.4);color:#6fcf97;',
    error:   'background:#2e1a1a;border:1px solid rgba(239,91,91,0.5);color:#ef8f8f;',
    info:    'background:#1e222e;border:1px solid rgba(255,255,255,0.12);color:#e8eaf0;',
  };
  const el = document.createElement('div');
  el.setAttribute('data-toast-type', type);
  el.style.cssText = `${colors[type] || colors.info}padding:11px 18px;border-radius:10px;font-size:13px;box-shadow:0 4px 20px rgba(0,0,0,0.4);display:flex;align-items:center;gap:12px;line-height:1.5;`;
  const span = document.createElement('span');
  span.textContent = msg;
  el.appendChild(span);
  if (opts.retry) {
    const btn = document.createElement('button');
    btn.textContent = '🔄 重試儲存';
    btn.style.cssText = 'background:rgba(255,255,255,0.12);border:none;color:inherit;padding:5px 12px;border-radius:6px;cursor:pointer;font-size:12px;font-family:inherit;white-space:nowrap;';
    btn.onclick = () => { el.remove(); saveStateImmediate(); };
    el.appendChild(btn);
  }
  if (duration === 0 || opts.retry) {
    const close = document.createElement('button');
    close.textContent = '✕';
    close.style.cssText = 'background:none;border:none;color:inherit;cursor:pointer;font-size:13px;opacity:0.6;padding:0 2px;';
    close.onclick = () => el.remove();
    el.appendChild(close);
  }
  box.appendChild(el);
  if (duration > 0) setTimeout(() => el.remove(), duration);
}

function setRefreshBtnDisabled(disabled) {
  const btn = document.getElementById('syncBtn');
  if (btn) btn.disabled = disabled;
}

function setSaveIndicator(status) {
  const el = document.getElementById('saveIndicator');
  if (!el) return;
  if (status === 'saving') {
    el.textContent = '⏳ 儲存中…';
    el.style.color = 'var(--text3)';
  } else if (status === 'saved') {
    const t = new Date(_lastSaveTime);
    const ts = `${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}:${String(t.getSeconds()).padStart(2,'0')}`;
    el.textContent = `✅ 已同步 ${ts}`;
    el.style.color = 'var(--success)';
  } else if (status === 'local') {
    el.textContent = '💾 本機儲存';
    el.style.color = 'var(--text3)';
  } else {
    el.textContent = '❌ 儲存失敗';
    el.style.color = 'var(--danger)';
  }
}

// ============================================================
// UTILITIES
// ============================================================

function getDaysInMonth(y, m) { return new Date(y, m, 0).getDate(); }
function getDow(y, m, d) { return new Date(y, m-1, d).getDay(); }
function dateKey(d) {
  if (typeof d === 'string') return d;
  return `${state.year}-${String(state.month).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}
function dowLabel(dow) { return ['日','一','二','三','四','五','六'][dow]; }
function isWeekend(dow) { return dow === 0 || dow === 6; }

function getStoreDay(storeId, day) {
  const ss = state.storeSettings[storeId];
  const dk = dateKey(day);
  const ovr = ss.dailyOverrides[dk] || {};
  const dow = getDow(state.year, state.month, typeof day === 'number' ? day : parseInt(day.split('-')[2]));
  const weekendDefault = isWeekend(dow) ? 2 : ss.defaultStaff;
  return {
    shiftType: ovr.shiftType || ss.defaultShiftType,
    staff: ovr.staff ?? weekendDefault,
  };
}

function getSlotKeys(storeId, day) {
  const sd = getStoreDay(storeId, day);
  const dk = dateKey(day);
  if (sd.shiftType === 'FULL') {
    return [{ key:`${dk}_${storeId}_FULL`, type:'FULL', staff:sd.staff }];
  } else {
    return [
      { key:`${dk}_${storeId}_AM`, type:'AM', staff:sd.staff },
      { key:`${dk}_${storeId}_PM`, type:'PM', staff:sd.staff },
    ];
  }
}

function getAssigned(slotKey) {
  return state.assignments[slotKey] || [];
}

function isEmployeeAvailable(emp, day) {
  const dk = typeof day === 'number' ? day : parseInt(day.split('-')[2]);
  return emp.availability && emp.availability.includes(dk);
}

function countShifts(empId) {
  let c = 0;
  for (const [k, arr] of Object.entries(state.assignments)) {
    if (arr.includes(empId)) c++;
  }
  return c;
}

function countShiftDays(empId) {
  const days = new Set();
  for (const [k, arr] of Object.entries(state.assignments)) {
    if (arr.includes(empId)) {
      days.add(k.split('_')[0]); // date part
    }
  }
  return days.size;
}

function getWorkedDays(empId) {
  const days = new Set();
  for (const [k, arr] of Object.entries(state.assignments)) {
    if (arr.includes(empId)) {
      days.add(k.split('_')[0]);
    }
  }
  return Array.from(days).sort();
}

function maxConsecutive(empId) {
  const days = getWorkedDays(empId);
  if (days.length === 0) return 0;
  let max = 1, cur = 1;
  for (let i = 1; i < days.length; i++) {
    const prev = new Date(days[i-1]);
    const curr = new Date(days[i]);
    const diff = (curr - prev) / 86400000;
    if (diff === 1) { cur++; max = Math.max(max, cur); }
    else { cur = 1; }
  }
  return max;
}

function isConflictPair(empId1, empId2) {
  return state.conflictPairs.some(([a,b]) =>
    (a === empId1 && b === empId2) || (a === empId2 && b === empId1)
  );
}

function getConflictsOnSlot(slotKey) {
  const assigned = getAssigned(slotKey);
  const conflicts = [];
  for (let i = 0; i < assigned.length; i++) {
    for (let j = i+1; j < assigned.length; j++) {
      if (isConflictPair(assigned[i], assigned[j])) {
        conflicts.push([assigned[i], assigned[j]]);
      }
    }
  }
  return conflicts;
}

// Check if adding empId to a slot would cause a conflict with existing assigned people
function wouldConflictOnSlot(empId, slotKey) {
  const assigned = getAssigned(slotKey);
  return assigned.some(otherId => isConflictPair(empId, otherId));
}

// Get all same-store slots on a given day (for conflict: same store same day counts)
function getSameStoreDaySlotKeys(storeId, day) {
  return getSlotKeys(storeId, day);
}

// Check if empId would conflict with anyone already assigned to the same store on the same day
function wouldConflictOnStoreDay(empId, storeId, day) {
  const slots = getSlotKeys(storeId, day);
  for (const slot of slots) {
    const assigned = getAssigned(slot.key);
    if (assigned.some(otherId => isConflictPair(empId, otherId))) return true;
  }
  return false;
}

function getViolations() {
  const v = [];
  const maxC = state.constraints.maxConsecutive;
  const totalDays = getDaysInMonth(state.year, state.month);
  for (const emp of state.employees) {
    const minS = emp.minShifts ?? state.constraints.defaultMinShifts;
    const maxS = emp.maxShifts ?? state.constraints.defaultMaxShifts;
    const sd = countShiftDays(emp.id);
    const availDays = (emp.availability || []).length;
    if (sd < minS) v.push({ empId:emp.id, type:'under', msg:`${emp.name} 排班 ${sd} 天，低於下限 ${minS}` });
    if (sd > maxS) v.push({ empId:emp.id, type:'over', msg:`${emp.name} 排班 ${sd} 天，超過上限 ${maxS}` });
    const mc = maxConsecutive(emp.id);
    if (mc > maxC) v.push({ empId:emp.id, type:'consecutive', msg:`${emp.name} 連續上班 ${mc} 天，超過上限 ${maxC}` });
    // NEW: scheduled days exceed available days
    if (sd > availDays) {
      v.push({ empId:emp.id, type:'overAvail', msg:`${emp.name} 排班 ${sd} 天，超過可上班天數 ${availDays} 天` });
    }
    // NEW: scheduled on unavailable day
    for (let d = 1; d <= totalDays; d++) {
      if (!isEmployeeAvailable(emp, d)) {
        let hit = false;
        for (const store of STORES) {
          for (const slot of getSlotKeys(store.id, d)) {
            if (getAssigned(slot.key).includes(emp.id)) { hit = true; break; }
          }
          if (hit) break;
        }
        if (hit) v.push({ empId:emp.id, type:'unavailable', msg:`${emp.name} 在 ${dateKey(d)} 排班，但該日設為不可上班` });
      }
    }
    // NEW: same day assigned to multiple stores
    for (let d = 1; d <= totalDays; d++) {
      const storesOnDay = [];
      for (const store of STORES) {
        for (const slot of getSlotKeys(store.id, d)) {
          if (getAssigned(slot.key).includes(emp.id)) { storesOnDay.push(store.id); break; }
        }
      }
      if (storesOnDay.length > 1) {
        const names = storesOnDay.map(sid => STORES.find(s=>s.id===sid)?.short||sid).join('、');
        v.push({ empId:emp.id, type:'multiStore', msg:`${emp.name} 在 ${dateKey(d)} 同時排到多家門市：${names}` });
      }
    }
  }
  // check understaffed slots
  for (let d = 1; d <= totalDays; d++) {
    for (const store of STORES) {
      const slots = getSlotKeys(store.id, d);
      for (const slot of slots) {
        const assigned = getAssigned(slot.key);
        if (assigned.length < slot.staff) {
          v.push({ type:'understaffed', msg:`${dateKey(d)} ${store.short} ${SHIFT_TYPES[slot.type].label} 需 ${slot.staff} 人，僅排 ${assigned.length} 人` });
        }
        // Check conflict pairs on same slot
        const slotConflicts = getConflictsOnSlot(slot.key);
        for (const [a, b] of slotConflicts) {
          const nameA = state.employees.find(e=>e.id===a)?.name || a;
          const nameB = state.employees.find(e=>e.id===b)?.name || b;
          v.push({ type:'conflict', msg:`${dateKey(d)} ${store.short} ${SHIFT_TYPES[slot.type].label}：${nameA} 與 ${nameB} 不可同班` });
        }
        // 新進員工班別無正式員工帶領
        if (assigned.length > 0) {
          const roles = assigned.map(id => roleOfId(id));
          if (roles.includes('new') && !roles.includes('regular')) {
            v.push({ type:'newbieNoMentor', msg:`${dateKey(d)} ${store.short} ${SHIFT_TYPES[slot.type].label}：此班別有新進員工，但沒有正式員工一起上班，請確認班表安排。` });
          }
        }
      }
    }
  }
  return v;
}

// ============================================================
// AUTO SCHEDULER (greedy)
// ============================================================

function autoSchedule() {
  if (!confirm('確定要重新自動排班嗎？目前班表可能會被重新更動。')) return;
  // Clear existing
  state.assignments = {};
  const totalDays = getDaysInMonth(state.year, state.month);
  const empShiftDays = {}; // empId -> Set of dates
  const empSlotCount = {}; // empId -> count of slot assignments
  state.employees.forEach(e => { empShiftDays[e.id] = new Set(); empSlotCount[e.id] = 0; });
  const maxC = state.constraints.maxConsecutive;

  // Build all slots
  const allSlots = [];
  for (let d = 1; d <= totalDays; d++) {
    for (const store of STORES) {
      const slots = getSlotKeys(store.id, d);
      for (const slot of slots) {
        allSlots.push({ ...slot, day:d, storeId:store.id });
      }
    }
  }

  // Sort: weekend first (harder to fill), then by staff needed desc
  allSlots.sort((a,b) => {
    const aw = isWeekend(getDow(state.year, state.month, a.day)) ? 0 : 1;
    const bw = isWeekend(getDow(state.year, state.month, b.day)) ? 0 : 1;
    if (aw !== bw) return aw - bw;
    return b.staff - a.staff;
  });

  function wouldExceedConsecutive(empId, day) {
    const dk = dateKey(day);
    const d = new Date(dk);
    // check forward and backward
    let before = 0;
    for (let i = 1; i <= maxC; i++) {
      const prev = new Date(d); prev.setDate(prev.getDate() - i);
      const pk = prev.toISOString().split('T')[0];
      if (empShiftDays[empId].has(pk)) before++; else break;
    }
    let after = 0;
    for (let i = 1; i <= maxC; i++) {
      const next = new Date(d); next.setDate(next.getDate() + i);
      const nk = next.toISOString().split('T')[0];
      if (empShiftDays[empId].has(nk)) after++; else break;
    }
    return (before + 1 + after) > maxC;
  }

  for (const slot of allSlots) {
    const needed = slot.staff;
    const dk = dateKey(slot.day);

    // Get candidates: available, not already assigned this day to another slot that conflicts,
    // not exceeding max shifts, not exceeding consecutive
    let candidates = state.employees.filter(e => {
      if (!isEmployeeAvailable(e, slot.day)) return false;
      // Store mode: 'assigned' means only allowed stores
      const sm = e.storeMode || 'none';
      const sl = e.storeList || e.preferredStores || [];
      if (sm === 'assigned' && sl.length > 0 && !sl.includes(slot.storeId)) return false;
      const maxS = e.maxShifts ?? state.constraints.defaultMaxShifts;
      if (empShiftDays[e.id].size >= maxS && !empShiftDays[e.id].has(dk)) return false;
      // already on this day? Check if same store + conflicting shift
      // A person can only work one store per day (full day) or two shifts at same store
      // Actually: one assignment per day maximum (simplification)
      if (empShiftDays[e.id].has(dk)) {
        // Already working this day — skip unless it's AM/PM split at same store
        // For simplicity: allow AM+PM same store, disallow different store same day
        const existingSlots = Object.entries(state.assignments).filter(([k,arr]) =>
          k.startsWith(dk) && arr.includes(e.id)
        );
        for (const [ek] of existingSlots) {
          const parts = ek.split('_');
          const existStore = parts[1];
          const existType = parts[2];
          if (existStore !== slot.storeId) return false; // diff store same day
          if (existType === 'FULL' || slot.type === 'FULL') return false; // full + anything = conflict
          if (existType === slot.type) return false; // same shift type
        }
      }
      if (!empShiftDays[e.id].has(dk) && wouldExceedConsecutive(e.id, slot.day)) return false;
      return true;
    });

    // Filter out candidates that would conflict with already-assigned people on this slot
    candidates = candidates.filter(e => {
      const currentAssigned = state.assignments[slot.key] || [];
      return !currentAssigned.some(otherId => isConflictPair(e.id, otherId));
    });

    // 逐位挑選：每挑一位就依「平衡 + 偏好門市 + 搭班偏好 + 帶新人」重新評分。
    // 這樣「此班已有新進員工」時，下一個座位會優先補進正式員工。
    const picks = [];
    let pool = candidates.slice();
    while (picks.length < needed && pool.length > 0) {
      const pickedRoles = picks.map(id => roleOfId(id));
      const hasRegular = pickedRoles.includes('regular');
      const hasNew = pickedRoles.includes('new');
      const seatsAfter = needed - picks.length - 1; // 挑完這位後還剩幾個空位

      let best = null, bestScore = -Infinity;
      for (const c of pool) {
        // 不能與已挑選者互斥
        if (picks.some(pid => isConflictPair(c.id, pid))) continue;
        let score = 0;
        // 平衡：目前班數越少越優先
        score -= empShiftDays[c.id].size * 2;
        // 偏好門市
        if (c.preferredStore === slot.storeId) score += 6;
        // 搭班偏好：夥伴已在此班 > 夥伴當天已有班
        const buddies = buddyIdsOf(c.id);
        if (buddies.some(bid => picks.includes(bid))) score += 40;
        else if (buddies.some(bid => empShiftDays[bid] && empShiftDays[bid].has(dk))) score += 15;
        // 帶新人規則（正式員工 ↔ 新進員工）
        const r = roleOfId(c.id);
        if (r === 'regular' && hasNew && !hasRegular) score += 45; // 此班有新進但無正職 → 優先補正職帶領
        else if (r === 'regular' && hasNew) score += 12;
        if (r === 'new' && !hasRegular) {
          if (seatsAfter <= 0) score -= 30; // 挑完就沒機會再補正職 → 避免新進落單／整班全新進
          else score -= 10;                 // 先讓正職進來
        }
        if (score > bestScore) { bestScore = score; best = c; }
      }
      if (!best) break;
      picks.push(best.id);
      empShiftDays[best.id].add(dk);
      empSlotCount[best.id]++;
      pool = pool.filter(x => x.id !== best.id);
    }
    if (picks.length > 0) {
      state.assignments[slot.key] = picks;
    }
  }

  saveState();
  render();
  const newbieWarnings = getViolations().filter(v => v.type === 'newbieNoMentor');
  if (newbieWarnings.length > 0) {
    showToast(`⚠️ 有 ${newbieWarnings.length} 個班別的新進員工沒有正式員工一起上班，請於違規提醒中確認`, 'error', 6000);
  } else {
    showToast('✅ 自動排班完成', 'success', 1800);
  }
}

      <div style="display:flex;align-items:center;gap:12px;">

        <button class="btn btn-ghost btn-sm" onclick="changeMonth(1)">▶</button>
        <button class="btn btn-ghost btn-sm" onclick="showMonthHistoryModal()">📚 歷史班表</button>
        ${_monthMeta.updatedAt ? `<span style="font-size:11px;color:var(--text3);">本月最後更新：${new Date(_monthMeta.updatedAt).toLocaleString('zh-TW',{hour12:false})}${_monthMeta.updatedBy ? `（${_monthMeta.updatedBy.split('@')[0]}）` : ''}</span>` : ''}

        <button class="btn btn-primary btn-sm" onclick="saveVersion()">💾 儲存班表</button>
        <button class="btn btn-ghost btn-sm" onclick="undoVersion()">↩ 返回上一版本</button>
        <button class="btn btn-ghost btn-sm" onclick="showExportImageModal()">📷 匯出圖片</button>
        <button class="btn btn-danger btn-sm" onclick="clearSchedule()">清除排班</button>
      </div>
    </div>
  `;

  // Stats
  const totalSlots = (() => {
    let c = 0;
    for (let d=1;d<=totalDays;d++) for (const s of STORES) {
      const slots = getSlotKeys(s.id, d);
      for (const sl of slots) c += sl.staff;
    }
    return c;
  })();
  const filledSlots = Object.values(state.assignments).reduce((a,b) => a + b.length, 0);

  html += `
    <div class="stats-bar no-print">
      <div class="stat-item">
        <div class="stat-value">${state.employees.length}</div>
        <div class="stat-label">員工人數</div>
      </div>
      <div class="stat-item">
        <div class="stat-value">${filledSlots} / ${totalSlots}</div>
        <div class="stat-label">已排 / 需排</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" style="color:${violations.length?'var(--danger)':'var(--success)'}">${violations.length}</div>
        <div class="stat-label">違規項目</div>
      </div>
    </div>
  `;

  // Violations
  if (violations.length > 0) {
    const criticalTypes = ['over','consecutive','unavailable','multiStore','conflict'];
    const warnTypes = ['under','overAvail','understaffed','newbieNoMentor'];
    const critCount = violations.filter(v => criticalTypes.includes(v.type)).length;
    const warnCount = violations.filter(v => warnTypes.includes(v.type)).length;
    html += `<div class="card no-print" style="border-color:rgba(239,91,91,0.3);">
      <div class="card-title" style="color:var(--danger);">⚠ 違規提醒 (${violations.length})</div>
      <div style="display:flex;gap:12px;margin-bottom:8px;font-size:11px;color:var(--text3);">
        ${critCount ? `<span style="color:var(--danger);">🔴 嚴重 ${critCount} 項</span>` : ''}
        ${warnCount ? `<span style="color:var(--warn);">🟡 警告 ${warnCount} 項</span>` : ''}
      </div>
      <div style="display:flex;flex-direction:column;gap:4px;">
        ${violations.slice(0,15).map(v => {
          const isCrit = criticalTypes.includes(v.type);
          return `<div class="violation" style="border-left:3px solid ${isCrit?'var(--danger)':'var(--warn)'};padding-left:8px;">${v.msg}</div>`;
        }).join('')}
        ${violations.length > 15 ? `<div style="font-size:11px;color:var(--text3);">...還有 ${violations.length-15} 項</div>` : ''}
      </div>
    </div>`;
  }

  // Legend
  html += `<div class="legend no-print">
    ${STORES.map(s => `<div class="legend-item"><div class="legend-dot" style="background:var(--${s.color}bg);border:1px solid var(--${s.color});"></div>${s.name}</div>`).join('')}
    <div class="legend-item"><div class="legend-dot" style="background:var(--successbg);border:1px solid var(--success);"></div>可排班</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--bg);border:1px solid var(--text3);"></div>不可排</div>
  </div>`;

  // Per-store schedule grids
  for (const store of STORES) {
    html += renderStoreGrid(store, totalDays);
  }

  // Employee summary
  html += `<div class="card" style="margin-top:16px;">
    <div class="card-title">📊 員工排班統計</div>
    <table>
      <tr><th>員工</th><th>身分</th><th>排班天數</th><th>班次數</th><th>下限</th><th>上限</th><th>可上班天</th><th>最大連續</th><th>狀態</th></tr>
      ${state.employees.map(e => {
        const sd = countShiftDays(e.id);
        const sc = countShifts(e.id);
        const minS = e.minShifts ?? state.constraints.defaultMinShifts;
        const maxS = e.maxShifts ?? state.constraints.defaultMaxShifts;
        const mc = maxConsecutive(e.id);
        const maxCon = state.constraints.maxConsecutive;
        const availDays = (e.availability || []).length;
        const empViolations = violations.filter(vv => vv.empId === e.id);
        const hasOver = empViolations.some(vv => vv.type === 'over');
        const hasUnder = empViolations.some(vv => vv.type === 'under');
        const hasCons = empViolations.some(vv => vv.type === 'consecutive');
        const hasUnavail = empViolations.some(vv => vv.type === 'unavailable');
        const hasMultiStore = empViolations.some(vv => vv.type === 'multiStore');
        const hasOverAvail = empViolations.some(vv => vv.type === 'overAvail');
        const hasAny = empViolations.length > 0;
        const statusParts = [];
        if (hasUnder) statusParts.push('<span title="排班不足" style="color:var(--warn);">⚠️ 不足</span>');
        if (hasOver) statusParts.push('<span title="排班超上限" style="color:var(--danger);">🔴 超上限</span>');
        if (hasCons) statusParts.push('<span title="連續超標" style="color:var(--danger);">🔴 連續超標</span>');
        if (hasUnavail) statusParts.push('<span title="排班日不可上班" style="color:var(--danger);">🔴 日期衝突</span>');
        if (hasMultiStore) statusParts.push('<span title="同日多店" style="color:var(--danger);">🔴 同日多店</span>');
        if (hasOverAvail) statusParts.push('<span title="超過可上班天數" style="color:var(--warn);">⚠️ 超可用天</span>');
        const statusCell = hasAny ? statusParts.join(' ') : '<span style="color:var(--success);">✅ 正常</span>';
        return `<tr>
          <td style="font-weight:500;">${e.name}</td>
          <td>${roleBadge(empRole(e))}</td>
          <td style="font-family:'JetBrains Mono',monospace;${sd>availDays?'color:var(--warn);':''}">${sd}</td>
          <td style="font-family:'JetBrains Mono',monospace;">${sc}</td>
          <td style="font-family:'JetBrains Mono',monospace;color:var(--text3);">${minS}</td>
          <td style="font-family:'JetBrains Mono',monospace;color:var(--text3);">${maxS}</td>
          <td style="font-family:'JetBrains Mono',monospace;color:var(--text3);">${availDays}</td>
          <td style="font-family:'JetBrains Mono',monospace;${mc > maxCon ? 'color:var(--danger);font-weight:600;' : ''}">${mc}</td>
          <td style="font-size:11px;white-space:nowrap;">${statusCell}</td>
        </tr>`;
      }).join('')}
    </table>
  </div>`;

  tc.innerHTML = html;
}

function renderStoreGrid(store, totalDays) {
  const cols = totalDays + 1; // +1 for name column
  let html = `
    <div class="card" style="overflow-x:auto;padding:12px;">
      <div class="card-title"><div class="dot" style="background:var(--${store.color})"></div>${store.name}</div>
      <div class="schedule-grid" style="grid-template-columns:80px repeat(${totalDays}, minmax(44px,1fr));">
  `;

  // Header row: dates
  html += `<div class="sg-cell name-cell header-cell">日期</div>`;
  for (let d = 1; d <= totalDays; d++) {
    const dow = getDow(state.year, state.month, d);
    const dowClass = dow === 6 ? 'dow-sat' : dow === 0 ? 'dow-sun' : '';
    html += `<div class="sg-cell header-cell ${dowClass}">${d}<br><span style="font-size:9px;">${dowLabel(dow)}</span></div>`;
  }

  // Employee rows
  for (const emp of state.employees) {
    html += `<div class="sg-cell name-cell"><div style="display:flex;align-items:center;gap:4px;">${emp.name} ${roleBadge(empRole(emp),'sm')}</div></div>`;
    for (let d = 1; d <= totalDays; d++) {
      const avail = isEmployeeAvailable(emp, d);
      const dk = dateKey(d);
      const slots = getSlotKeys(store.id, d);

      // Check if assigned to this store on this day
      let assignedHere = false;
      let cellContent = '';
      let cellClass = '';

      for (const slot of slots) {
        const asg = getAssigned(slot.key);
        if (asg.includes(emp.id)) {
          assignedHere = true;
          const typeLabel = SHIFT_TYPES[slot.type].short;
          cellContent += `<div class="shift-content"><span class="shift-store">${typeLabel}</span></div>`;
        }
      }

      if (assignedHere) {
        cellClass = `assigned ${store.color}`;
        html += `<div class="sg-cell ${cellClass}" onclick="toggleAssign('${emp.id}','${store.id}',${d})">${cellContent}</div>`;
      } else if (avail) {
        html += `<div class="sg-cell available" onclick="toggleAssign('${emp.id}','${store.id}',${d})">○</div>`;
      } else {
        html += `<div class="sg-cell unavailable">—</div>`;
      }
    }
  }

  // Staffing summary row
  html += `<div class="sg-cell name-cell" style="font-weight:600;color:var(--text2);font-size:10px;">人力</div>`;
  for (let d = 1; d <= totalDays; d++) {
    const slots = getSlotKeys(store.id, d);
    let filled = 0, needed = 0;
    for (const slot of slots) {
      filled += getAssigned(slot.key).length;
      needed += slot.staff;
    }
    const ok = filled >= needed;
    html += `<div class="sg-cell" style="font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;color:${ok?'var(--success)':'var(--danger)'};">${filled}/${needed}</div>`;
  }

  html += `</div></div>`;
  return html;
}

function toggleAssign(empId, storeId, day) {
  const emp = state.employees.find(e => e.id === empId);
  if (!emp || !isEmployeeAvailable(emp, day)) return;

  const slots = getSlotKeys(storeId, day);

  // Check if already assigned
  let wasAssigned = false;
  for (const slot of slots) {
    const asg = getAssigned(slot.key);
    const idx = asg.indexOf(empId);
    if (idx >= 0) {
      asg.splice(idx, 1);
      state.assignments[slot.key] = asg;
      wasAssigned = true;
    }
  }

  if (!wasAssigned) {
    // Assign to first slot
    const slot = slots[0];
    if (!state.assignments[slot.key]) state.assignments[slot.key] = [];
    state.assignments[slot.key].push(empId);
    // If split shift, show modal to choose AM/PM
    if (slots.length > 1) {
      showShiftChoiceModal(empId, storeId, day, slots);
      return;
    }
  }

  saveState();
  render();
}

function showShiftChoiceModal(empId, storeId, day, slots) {
  const emp = state.employees.find(e => e.id === empId);
  const store = STORES.find(s => s.id === storeId);
  // Remove from first slot (we added it above)
  const firstAsg = state.assignments[slots[0].key];
  if (firstAsg) {
    const idx = firstAsg.indexOf(empId);
    if (idx >= 0) firstAsg.splice(idx, 1);
  }

  modal = `
    <h2>選擇班別 — ${emp.name} @ ${store.short} ${dateKey(day)}</h2>
    <div style="display:flex;gap:8px;margin-top:16px;">
      ${slots.map(sl => `
        <button class="btn btn-primary btn-lg" onclick="assignSlot('${empId}','${sl.key}')">${SHIFT_TYPES[sl.type].label}</button>
      `).join('')}
      <button class="btn btn-ghost btn-lg" onclick="assignBothSlots('${empId}','${slots.map(s=>s.key).join(',')}')" style="margin-left:8px;">早晚都排</button>
    </div>
    <button class="btn btn-ghost" style="margin-top:12px;" onclick="closeModal()">取消</button>
  `;
  render();
}

function assignSlot(empId, slotKey) {
  if (!state.assignments[slotKey]) state.assignments[slotKey] = [];
  if (!state.assignments[slotKey].includes(empId)) {
    state.assignments[slotKey].push(empId);
  }
  modal = null;
  saveState();
  render();
}

function assignBothSlots(empId, keys) {
  keys.split(',').forEach(k => {
    if (!state.assignments[k]) state.assignments[k] = [];
    if (!state.assignments[k].includes(empId)) state.assignments[k].push(empId);
  });
  modal = null;
  saveState();
  render();
}

async function changeMonth(delta) {
  await gotoMonth(state.year, state.month + delta);
}

// 切換到指定年月。關鍵防護：
// 1. 先 flush 尚未送出的儲存（舊版沒做 → 延遲儲存會把空班表寫進新月份，洗掉雲端資料）
// 2. 載入期間鎖定 _loadingState，任何儲存都會被擋下
async function gotoMonth(year, month) {
  // 先把未儲存的變更送出，確認寫入雲端後才切換
  if (_saveTimer || _saving || _dirty) {
    setSaveIndicator('saving');
    try { await saveStateImmediate(); } catch(e) {}
    if (_dirty) {
      if (!confirm('⚠️ 目前的變更尚未成功儲存至雲端，切換月份將遺失這些變更。\n\n仍要切換嗎？')) return;
      _dirty = false; // 使用者選擇放棄變更
    }
  }
  _loadingState = true;
  state.year = year;
  state.month = month;
  if (state.month > 12) { state.month = 1; state.year++; }
  if (state.month < 1) { state.month = 12; state.year--; }
  state.assignments = {};
  render();
  try {
    await loadState();
  } finally {
    _loadingState = false;
  }
  render();
}

      ${months.map(m => {

          <span style="font-weight:700;font-family:'JetBrains Mono',monospace;font-size:14px;">${y} 年 ${Number(mo)} 月</span>

async function refreshData() {
  // If a save is still in flight, wait for it first to avoid overwriting fresh data
  if (_savePromise) {
    setSaveIndicator('saving');
    try { await _savePromise; } catch(e) {}
  }
  if (_useLocalFallback) {
    loadStateFromLocalStorage();
    render();
    return;
  }
  setSaveIndicator('saving');
  await loadState();
  render();
  if (!_dirty) {
    _lastSaveTime = Date.now();
    setSaveIndicator('saved');
    showToast('🔄 已同步最新雲端資料', 'success', 1600);
  }
}

function clearSchedule() {
  if (confirm('確定清除所有排班資料？（員工可排班日不受影響）')) {
    state.assignments = {};
    saveState({ force: true }); // 刻意清空，帶 force 跳過後端空覆寫防護
    render();
  }
}

// ── 版本快照：儲存班表 / 返回上一版本 ──────────────────────────
async function saveVersion() {
  if (_useLocalFallback) { alert('本機開發模式不支援版本快照。'); return; }
  // 先確保目前變更已寫入雲端，版本快照才會包含最新內容
  if (_saveTimer || _saving || _dirty) {
    try { await saveStateImmediate(); } catch(e) {}
    if (_dirty) { showToast('❌ 目前變更尚未成功儲存至雲端，請稍後再按一次', 'error', 4000); return; }
  }
  try {
    await apiFetch(`/api/versions?month=${monthKey()}&action=save`, { method: 'POST' });
    showToast('班表已儲存成功。', 'success', 2200);
  } catch(e) {
    if (e.kind === 'auth') { showAuthExpiredModal(); return; }
    showToast(`❌ 儲存版本失敗：${e.message}`, 'error', 5000);
  }
}

async function undoVersion() {
  if (_useLocalFallback) { alert('本機開發模式不支援版本還原。'); return; }
  if (!confirm('確定要返回上一個版本嗎？目前尚未儲存的更動可能會消失。')) return;
  // 取消待送的儲存，避免還原後又把舊資料寫回雲端
  if (_saveTimer) { clearTimeout(_saveTimer); _saveTimer = null; }
  _dirty = false;
  try {
    await apiFetch(`/api/versions?month=${monthKey()}&action=undo`, { method: 'POST' });
    // 還原成功 → 重新載入雲端資料（含被還原的 assignments）
    _loadingState = true;
    try { await loadState(); } finally { _loadingState = false; }
    render();
    showToast('↩ 已返回上一版本', 'success', 2200);
  } catch(e) {
    if (e.kind === 'auth') { showAuthExpiredModal(); return; }
    if (e.status === 400) { showToast(`⚠️ ${e.message}`, 'error', 5000); return; }
    showToast(`❌ 返回版本失敗：${e.message}`, 'error', 5000);
  }
}

            ${conflictNames.length > 0 ? `<div style="font-size:11px;color:var(--danger);margin-top:4px;">🚫 不可同班：${conflictNames.join('、')}</div>` : ''}
          </div>
          <div style="display:flex;gap:6px;">
            <button class="btn btn-ghost btn-sm" onclick="editEmployee('${emp.id}')">編輯</button>
            <button class="btn btn-danger btn-sm" onclick="deleteEmployee('${emp.id}')">刪除</button>
          </div>
        </div>
        <div style="margin-top:12px;">
          <label>可排班日（點擊切換）</label>
          <div style="display:flex;flex-wrap:wrap;gap:3px;margin-top:6px;">
            ${Array.from({length:totalDays}, (_,i) => i+1).map(d => {
              const avail = isEmployeeAvailable(emp, d);
              const dow = getDow(state.year, state.month, d);
              const dowClass = dow === 6 ? 'dow-sat' : dow === 0 ? 'dow-sun' : '';
              return `<div class="sg-cell ${avail?'available':'unavailable'} ${dowClass}"
                style="width:36px;height:32px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;border-radius:4px;font-size:11px;"
                onclick="toggleAvail('${emp.id}',${d})">
                <span>${d}</span>
                <span style="font-size:8px;">${dowLabel(dow)}</span>
              </div>`;
            }).join('')}
          </div>
        </div>
      </div>
    `;
  }

  tc.innerHTML = html;
}

function addEmployee() {
  const name = prompt('請輸入員工姓名：');
  if (!name || !name.trim()) return;
  state.employees.push({
    id: 'emp_' + Date.now(),
    name: name.trim(),
    role: 'regular',          // 'regular' | 'new' | 'intern'
    availability: [],
    minShifts: null,
    maxShifts: null,
    storeMode: 'none',       // 'none' | 'preferred' | 'assigned'
    storeList: [],            // store ids
    preferredStores: [],      // kept for backward compat
  });
  saveState();
  render();
}

function editEmployee(empId) {

  const maxS = emp.maxShifts ?? state.constraints.defaultMaxShifts;

  const sl = emp.storeList || emp.preferredStores || [];
  const role = empRole(emp);

  modal = `
    <h2>編輯 — ${emp.name}</h2>
    <div style="display:flex;flex-direction:column;gap:14px;margin-top:12px;">
      <div>
        <label>姓名</label>
        <input id="editName" value="${emp.name}" />
      </div>
      <div>
        <label>員工身分</label>
        <div class="toggle-group" style="margin-top:4px;">
          ${Object.values(ROLES).map(r => `
            <button class="toggle-opt ${role===r.id?'active':''}" id="role_${r.id}"
              onclick="document.querySelectorAll('[id^=role_]').forEach(b=>b.classList.remove('active'));this.classList.add('active')">
              ${r.icon} ${r.label}
            </button>
          `).join('')}
        </div>
        <p style="font-size:11px;color:var(--text3);margin-top:6px;">「新進員工」自動排班時會優先安排正式員工一起上班帶領。</p>
      </div>
      <div class="grid-2">
        <div>
          <label>最少班數（天）</label>
          <input id="editMin" type="number" value="${minS}" min="0" max="31" />
        </div>
        <div>
          <label>最多班數（天）</label>
          <input id="editMax" type="number" value="${maxS}" min="0" max="31" />
        </div>
      </div>
      <div>
        <label>門市指派模式</label>
        <div class="toggle-group" style="margin-top:4px;">
          <button class="toggle-opt ${sm==='none'?'active':''}" onclick="setStoreMode('none')" id="smNone">不指定</button>
          <button class="toggle-opt ${sm==='assigned'||sm==='preferred'?'active':''}" onclick="setStoreMode('assigned')" id="smAssign">指定門市</button>
        </div>
        <p style="font-size:11px;color:var(--text3);margin-top:6px;" id="storeModeHint">${sm==='none'?'三家門市皆可排班，由系統平均分配。':'只能排到下方勾選的門市。可進一步設定其中偏好的優先門市。'}</p>
      </div>
      <div id="storeCheckboxSection" style="${sm==='none'?'opacity:0.4;pointer-events:none;':''}">
        <div style="background:var(--bg3);border-radius:8px;padding:12px;">
          <label style="margin-bottom:8px;display:block;">📍 可工作的門市（可複選）</label>
          <div style="display:flex;gap:12px;margin-top:6px;flex-wrap:wrap;">
            ${STORES.map(s => `
              <label class="checkbox-row">
                <input type="checkbox" class="empStore" value="${s.id}" ${sl.includes(s.id)?'checked':''} onchange="updatePreferredOptions()" />
                <span style="display:inline-flex;align-items:center;gap:4px;">
                  <span style="width:8px;height:8px;border-radius:50%;background:var(--${s.color});"></span>
                  ${s.name}
                </span>
              </label>
            `).join('')}
          </div>
          <div id="preferredSection" style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border);${sl.length===0?'display:none;':''}">
            <label style="margin-bottom:6px;display:block;">⭐ 優先偏好的門市（從上方勾選中選一個，可留空）</label>
            <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;" id="preferredRadios">
              ${renderPreferredRadios(sl, emp.preferredStore || '')}
            </div>
            <p style="font-size:10px;color:var(--text3);margin-top:6px;">設定偏好後，自動排班會優先將此員工排到偏好門市，其次才是其他可工作門市。</p>
          </div>
        </div>
      </div>
    </div>
    <div style="display:flex;gap:8px;margin-top:16px;">
      <button class="btn btn-primary" onclick="saveEmployee('${empId}')">儲存</button>
      <button class="btn btn-ghost" onclick="closeModal()">取消</button>

function renderPreferredRadios(storeList, currentPref) {
  if (!storeList || storeList.length === 0) return '';
  let html = `<label class="checkbox-row"><input type="radio" name="prefStore" value="" ${!currentPref?'checked':''} /> <span style="font-size:12px;color:var(--text3);">不設定偏好</span></label>`;
  for (const sid of storeList) {
    const s = STORES.find(st => st.id === sid);
    if (!s) continue;
    html += `<label class="checkbox-row">
      <input type="radio" name="prefStore" value="${s.id}" ${currentPref===s.id?'checked':''} />
      <span style="display:inline-flex;align-items:center;gap:4px;">
        <span style="width:8px;height:8px;border-radius:50%;background:var(--${s.color});"></span>
        ${s.name}
      </span>
    </label>`;
  }
  return html;
}

function updatePreferredOptions() {
  const checked = Array.from(document.querySelectorAll('.empStore:checked')).map(c => c.value);
  const section = document.getElementById('preferredSection');
  const radios = document.getElementById('preferredRadios');
  if (!section || !radios) return;
  if (checked.length === 0) {
    section.style.display = 'none';
  } else {
    section.style.display = 'block';
    const currentPref = document.querySelector('input[name="prefStore"]:checked')?.value || '';
    const validPref = checked.includes(currentPref) ? currentPref : '';
    radios.innerHTML = renderPreferredRadios(checked, validPref);
  }
}

function setStoreMode(mode) {
  document.getElementById('smNone').classList.toggle('active', mode==='none');
  document.getElementById('smAssign').classList.toggle('active', mode==='assigned' || mode==='preferred');
  const section = document.getElementById('storeCheckboxSection');
  const hint = document.getElementById('storeModeHint');
  if (mode === 'none') {
    section.style.opacity = '0.4'; section.style.pointerEvents = 'none';
    hint.textContent = '三家門市皆可排班，由系統平均分配。';
  } else {
    section.style.opacity = '1'; section.style.pointerEvents = 'auto';
    hint.textContent = '只能排到下方勾選的門市。可進一步設定其中偏好的優先門市。';
    updatePreferredOptions();
  }
}

function saveEmployee(empId) {
  const emp = state.employees.find(e => e.id === empId);
  if (!emp) return;
  emp.name = document.getElementById('editName').value.trim() || emp.name;
  const activeRole = document.querySelector('[id^=role_].active');
  emp.role = activeRole ? activeRole.id.replace('role_', '') : (emp.role || 'regular');
  const minV = parseInt(document.getElementById('editMin').value);
  const maxV = parseInt(document.getElementById('editMax').value);
  emp.minShifts = isNaN(minV) ? null : minV;
  emp.maxShifts = isNaN(maxV) ? null : maxV;
  // Store mode: none or assigned (with optional preferred)
  const isAssigned = document.getElementById('smAssign').classList.contains('active');
  emp.storeMode = isAssigned ? 'assigned' : 'none';
  emp.storeList = Array.from(document.querySelectorAll('.empStore:checked')).map(c => c.value);
  emp.preferredStores = emp.storeList; // backward compat
  // Preferred store (single, among assigned)
  const prefRadio = document.querySelector('input[name="prefStore"]:checked');
  emp.preferredStore = (prefRadio && emp.storeList.includes(prefRadio.value)) ? prefRadio.value : '';
  modal = null;
  saveState();
  render();
}

function deleteEmployee(empId) {
  if (!confirm('確定刪除此員工？')) return;
  state.employees = state.employees.filter(e => e.id !== empId);
  // Remove from assignments
  for (const [k, arr] of Object.entries(state.assignments)) {
    state.assignments[k] = arr.filter(id => id !== empId);
  }
  // Remove from conflict pairs & buddy pairs
  state.conflictPairs = state.conflictPairs.filter(([a,b]) => a !== empId && b !== empId);
  state.buddyPairs = (state.buddyPairs || []).filter(([a,b]) => a !== empId && b !== empId);
  // 刪到最後一位員工時屬刻意清空，帶 force 跳過後端防護
  saveState({ force: state.employees.length === 0 });
  render();
}

function toggleAvail(empId, day) {
  const emp = state.employees.find(e => e.id === empId);
  if (!emp) return;
  if (!emp.availability) emp.availability = [];
  const idx = emp.availability.indexOf(day);
  if (idx >= 0) emp.availability.splice(idx, 1);
  else emp.availability.push(day);
  emp.availability.sort((a,b) => a-b);
  saveState();
  render();
}

function batchAvailModal() {
  const totalDays = getDaysInMonth(state.year, state.month);
  modal = `
    <h2>批次設定可排班日</h2>
    <p style="font-size:12px;color:var(--text2);margin-bottom:12px;">快速將所有員工設定為特定日期可排班</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;">
      <button class="btn btn-ghost btn-sm" onclick="batchSetAll()">全部可排</button>
      <button class="btn btn-ghost btn-sm" onclick="batchSetWeekdays()">僅平日</button>
      <button class="btn btn-ghost btn-sm" onclick="batchSetWeekends()">僅週末</button>
      <button class="btn btn-danger btn-sm" onclick="batchClearAll()">全部清除</button>
    </div>
    <button class="btn btn-ghost" onclick="closeModal()">關閉</button>
  `;
  render();
}

function batchSetAll() {
  const totalDays = getDaysInMonth(state.year, state.month);
  state.employees.forEach(e => { e.availability = Array.from({length:totalDays},(_,i)=>i+1); });
  modal = null; saveState(); render();
}
function batchSetWeekdays() {
  const totalDays = getDaysInMonth(state.year, state.month);
  state.employees.forEach(e => {
    e.availability = [];
    for (let d=1;d<=totalDays;d++) {
      if (!isWeekend(getDow(state.year, state.month, d))) e.availability.push(d);
    }
  });
  modal = null; saveState(); render();
}
function batchSetWeekends() {
  const totalDays = getDaysInMonth(state.year, state.month);
  state.employees.forEach(e => {
    e.availability = [];
    for (let d=1;d<=totalDays;d++) {
      if (isWeekend(getDow(state.year, state.month, d))) e.availability.push(d);
    }
  });
  modal = null; saveState(); render();
}
function batchClearAll() {
  state.employees.forEach(e => { e.availability = []; });
  modal = null; saveState(); render();
}

function updateConstraint(key, val) {
  state.constraints[key] = parseInt(val) || 0;
  saveState();
}

function pairExists(list, a, b) {
  return list.some(([x,y]) => (x === a && y === b) || (x === b && y === a));
}

function addConflictPair() {
  const a = document.getElementById('conflictA').value;
  const b = document.getElementById('conflictB').value;
  if (a === b) { alert('請選擇兩位不同的員工'); return; }
  if (pairExists(state.conflictPairs, a, b)) { alert('此互斥組合已存在'); return; }
  if (pairExists(state.buddyPairs || [], a, b)) {
    alert('這兩位已設為「搭班偏好」，不能同時設為互斥。請先移除搭班偏好。'); return;
  }
  state.conflictPairs.push([a, b]);
  saveState();
  render();
}

function removeConflictPair(idx) {
  state.conflictPairs.splice(idx, 1);
  saveState();
  render();
}

function addBuddyPair() {
  const a = document.getElementById('buddyA').value;
  const b = document.getElementById('buddyB').value;
  if (a === b) { alert('請選擇兩位不同的員工'); return; }
  if (pairExists(state.buddyPairs || [], a, b)) { alert('此搭班偏好已存在'); return; }
  if (pairExists(state.conflictPairs, a, b)) {
    alert('這兩位已設為「互斥（不可同班）」，不能同時設為搭班偏好。請先移除互斥組合。'); return;
  }
  if (!state.buddyPairs) state.buddyPairs = [];
  state.buddyPairs.push([a, b]);
  saveState();
  render();
}

function removeBuddyPair(idx) {
  state.buddyPairs.splice(idx, 1);
  saveState();
  render();
}

function setStoreDefault(storeId, field, val) {
  if (field === 'shiftType') {
    state.storeSettings[storeId].defaultShiftType = val;
  } else if (field === 'staff') {
    state.storeSettings[storeId].defaultStaff = parseInt(val) || 1;
  }
  saveState();
  render();
}

function editDayOverride(storeId, day) {
  const dk = dateKey(day);
  const ss = state.storeSettings[storeId];
  const ovr = ss.dailyOverrides[dk] || {};
  const sd = getStoreDay(storeId, day);
  const store = STORES.find(s => s.id === storeId);
  const dow = getDow(state.year, state.month, day);

  modal = `
    <h2>${store.name} — ${state.month}/${day}（${dowLabel(dow)}）</h2>
    <div style="display:flex;flex-direction:column;gap:12px;margin-top:12px;">
      <div>
        <label>班別</label>
        <div class="toggle-group">
          <button class="toggle-opt ${sd.shiftType==='FULL'?'active':''}" id="ovrFull"
            onclick="this.classList.add('active');document.getElementById('ovrSplit').classList.remove('active')">整日班</button>
          <button class="toggle-opt ${sd.shiftType!=='FULL'?'active':''}" id="ovrSplit"
            onclick="this.classList.add('active');document.getElementById('ovrFull').classList.remove('active')">早晚班</button>
        </div>
      </div>
      <div>
        <label>人數</label>

      <button class="btn btn-ghost" onclick="closeModal()">取消</button>

function saveDayOverride(storeId, dk) {
  const isFullActive = document.getElementById('ovrFull').classList.contains('active');
  const staff = parseInt(document.getElementById('ovrStaff').value) || 1;
  state.storeSettings[storeId].dailyOverrides[dk] = {
    shiftType: isFullActive ? 'FULL' : 'SPLIT',
    staff: staff,
  };
  modal = null;
  saveState();
  render();
}

function clearDayOverride(storeId, dk) {
  delete state.storeSettings[storeId].dailyOverrides[dk];
  modal = null;
  saveState();
  render();
}

function showAddStoreModal() {
  modal = `
    <h2>➕ 新增門市</h2>
    <div style="display:flex;flex-direction:column;gap:14px;margin-top:12px;">
      <div>

      </div>
      <div>
        <label>門市縮寫（2–4 字，例：信義）</label>
        <input id="newStoreShort" placeholder="請輸入縮寫" maxlength="4" />
      </div>
    </div>
    <div style="display:flex;gap:8px;margin-top:16px;">
      <button class="btn btn-primary" onclick="confirmAddStore()">新增</button>
      <button class="btn btn-ghost" onclick="closeModal()">取消</button>
    </div>
  `;
  render();
}

function confirmAddStore() {
  const name = (document.getElementById('newStoreName').value || '').trim();
  const short = (document.getElementById('newStoreShort').value || '').trim();
  if (!name)  { alert('請輸入門市名稱'); return; }
  if (!short) { alert('請輸入門市縮寫'); return; }
  if (STORES.length >= COLOR_PALETTE.length) { alert('最多支援 ' + COLOR_PALETTE.length + ' 家門市'); return; }

  const usedColors = STORES.map(s => s.color);
  const nextColor = COLOR_PALETTE.find(c => !usedColors.includes(c)) || 'store1';
  const id = 'store_' + Date.now();

  if (!state.stores) state.stores = [...STORES];
  state.stores = [...state.stores, { id, name, short, color: nextColor }];
  STORES = state.stores;
  state.storeSettings[id] = { defaultShiftType:'FULL', defaultStaff:1, dailyOverrides:{} };

  modal = null;
  saveState();
  render();
}

function removeStore(storeId) {
  const store = STORES.find(s => s.id === storeId);
  if (!store) return;
  if (STORES.length <= 1) { alert('至少要保留一家門市'); return; }

  const hasAssignments = Object.keys(state.assignments || {}).some(k => k.includes('_' + storeId + '_'));
  const msg = hasAssignments
    ? `「${store.name}」目前有排班資料，刪除後該門市所有排班將一併清除。確定要刪除嗎？`
    : `確定要刪除「${store.name}」？`;
  if (!confirm(msg)) return;

  if (hasAssignments) {
    for (const key of Object.keys(state.assignments)) {
      if (key.includes('_' + storeId + '_')) delete state.assignments[key];
    }
  }
  state.stores = STORES.filter(s => s.id !== storeId);
  STORES = state.stores;
  delete state.storeSettings[storeId];

  for (const emp of state.employees) {
    if (emp.storeList) emp.storeList = emp.storeList.filter(s => s !== storeId);
    if (emp.preferredStore === storeId) emp.preferredStore = '';
  }
  saveState();
  render();
}

function editStoreInfo(storeId) {
  const store = STORES.find(s => s.id === storeId);
  if (!store) return;
  modal = `
    <h2>✏️ 編輯門市</h2>
    <div style="display:flex;flex-direction:column;gap:14px;margin-top:12px;">
      <div>
        <label>門市名稱</label>
        <input id="editStoreName" value="${store.name}" />
      </div>
      <div>
        <label>縮寫（2–4 字）</label>
        <input id="editStoreShort" value="${store.short}" maxlength="4" />
      </div>
    </div>
    <div style="display:flex;gap:8px;margin-top:16px;">
      <button class="btn btn-primary" onclick="saveStoreInfo('${storeId}')">儲存</button>
      <button class="btn btn-ghost" onclick="closeModal()">取消</button>
    </div>
  `;
  render();
}

function saveStoreInfo(storeId) {
  const name = (document.getElementById('editStoreName').value || '').trim();
  const short = (document.getElementById('editStoreShort').value || '').trim();
  if (!name || !short) { alert('名稱和縮寫不能為空'); return; }
  const idx = state.stores.findIndex(s => s.id === storeId);
  if (idx === -1) return;
  state.stores[idx].name = name;
  state.stores[idx].short = short;
  STORES = state.stores;
  modal = null;
  saveState();
  render();
}

async function resetAll() {
  if (!confirm('確定要重設所有資料？此操作不可復原。')) return;
  state = { ...DEFAULT_STATE, stores: [...DEFAULT_STORES] };
  STORES = state.stores;
  await saveStateImmediate({ force: true }); // 刻意重設，帶 force 跳過後端防護
  render();
}

function exportJSON() {
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `排班_${state.year}_${String(state.month).padStart(2,'0')}_v2.9.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importJSON() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const text = await file.text();
      const data = JSON.parse(text);
      if (data.employees && data.storeSettings) {
        state = { ...DEFAULT_STATE, ...data };
        syncStores();
        await saveStateImmediate({ force: true }); // 匯入屬刻意覆寫
        render();
      } else {
        alert('檔案格式不正確');
      }
    } catch(e) { alert('無法讀取檔案：' + e.message); }
  };
  input.click();
}

// THEME TOGGLE

function toggleTheme() {
  const isLight = document.body.classList.toggle('light-mode');
  localStorage.setItem('shiftScheduler_theme', isLight ? 'light' : 'dark');
  const label = document.getElementById('themeLabel');
  const icon = document.querySelector('.toggle-icon');
  if (label) label.textContent = isLight ? '開燈' : '關燈';
  if (icon) icon.textContent = isLight ? '☀️' : '🌙';
}

function applyTheme() {
  const saved = localStorage.getItem('shiftScheduler_theme');
  if (saved === 'light') {
    document.body.classList.add('light-mode');
  }
}

function buildCalendarHTML(storeId) {
  const store = STORES.find(s => s.id === storeId);
  const totalDays = getDaysInMonth(state.year, state.month);
  const firstDow = getDow(state.year, state.month, 1); // 0=Sun
  // Adjust so Monday=0 for calendar grid (Mon–Sun)
  const firstCol = (firstDow === 0) ? 6 : firstDow - 1; // Mon-based offset

  const isLight = document.body.classList.contains('light-mode');

  const colorData = COLOR_MAP[store.color] || COLOR_MAP.store1;
  const sc = isLight ? colorData.light : colorData.dark;

    dowText:   '#8b90a8',
    cellBg:    '#ffffff',
    emptyBg:   '#f4f5f7',
    weekendBg: '#fdf3e7',
    borderCol: 'rgba(0,0,0,0.07)',
    dayNumCol: '#4a5068',
    noStaff:   '#b0b5c8',
    satColor:  '#c47d1a',
    sunColor:  '#d63838',
    titleCol:  '#1a1d2e',
    brandCol:  '#8b90a8',
  } : {
    bodyBg:    '#12141f',
    calWrapBg: '#12141f',
    headerBg:  '#1a1d2a',
    dowBg:     '#1a1d2a',
    dowText:   '#636a80',
    cellBg:    '#181b24',

    borderCol: 'rgba(255,255,255,0.05)',
    dayNumCol: '#9aa0b4',

    sunColor:  '#ef5b5b',
    titleCol:  '#e8eaf0',
    brandCol:  '#636a80',
  };

  // Gather per-day data
  const days = [];
  for (let d = 1; d <= totalDays; d++) {
    const dow = getDow(state.year, state.month, d);
    const dk = dateKey(d);
    const slots = getSlotKeys(storeId, d);
    const workers = [];
    for (const slot of slots) {
      const asg = getAssigned(slot.key);
      for (const empId of asg) {
        const emp = state.employees.find(e => e.id === empId);
        if (emp) {
          const typeLabel = slots.length > 1 ? SHIFT_TYPES[slot.type].short : '';
          workers.push({ name: emp.name, type: typeLabel });
        }
      }
    }
    days.push({ d, dow, workers });

  // Build 6-row calendar grid with empty leading cells
  const cells = [];
  for (let i = 0; i < firstCol; i++) cells.push(null);
  for (const day of days) cells.push(day);

    <div>
      <div class="cal-title">${monthLabel}　班表</div>
      <div class="cal-store">${store.name}</div>
      <div class="cal-brand">THE food co. 同興實業</div>
    </div>
    <div style="font-size:40px;opacity:0.25;">📅</div>
  </div>
  <div class="dow-row">
    ${dowHeaders.map((h,i) => `<div class="dow-cell${i===5?' sat':i===6?' sun':''}">${h}</div>`).join('')}
  </div>`;

  for (const week of weeks) {
    html += `<div class="week-row">`;
    for (let col = 0; col < 7; col++) {
      const cell = week[col];
      if (!cell) {
        html += `<div class="day-cell empty"></div>`;
        continue;
      }
      const isSat = col === 5;
      const isSun = col === 6;
      const isWeekendDay = isSat || isSun;
      const numClass = isSat ? 'sat' : isSun ? 'sun' : '';
      const workersHTML = cell.workers.length > 0
        ? cell.workers.map(w => `<div class="worker-chip">${w.name}${w.type ? `<span class="type-badge">${w.type}</span>` : ''}</div>`).join('')
        : `<div class="no-staff">—</div>`;
      html += `
        <div class="day-cell${isWeekendDay ? ' weekend' : ''}">
          <div class="day-num ${numClass}">${cell.d}</div>
          <div class="workers">${workersHTML}</div>
        </div>`;
    }
    html += `</div>`;
  }

  html += `</div></body></html>`;
  return html;
}

async function exportStoreImage(storeId) {
  const store = STORES.find(s => s.id === storeId);

  // Show loading toast
  const toast = document.createElement('div');
  toast.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1e222e;border:1px solid rgba(255,255,255,0.1);color:#e8eaf0;padding:12px 24px;border-radius:10px;font-size:14px;z-index:9999;box-shadow:0 4px 20px rgba(0,0,0,0.4);';
  toast.textContent = `⏳ 正在產生 ${store.name} 班表圖片...`;
  document.body.appendChild(toast);

  await new Promise(r => setTimeout(r, 50));

  try {
    // Build calendar HTML in an offscreen iframe
    const calHTML = buildCalendarHTML(storeId);
    const iframe = document.createElement('iframe');
    iframe.style.cssText = 'position:fixed;left:-9999px;top:0;width:1080px;height:2000px;border:none;';
    document.body.appendChild(iframe);

    await new Promise(resolve => {
      iframe.onload = resolve;
      iframe.srcdoc = calHTML;
    });

    // Wait for fonts
    await new Promise(r => setTimeout(r, 800));

    const calRoot = iframe.contentDocument.getElementById('calRoot');
    const isLightExport = document.body.classList.contains('light-mode');
    const canvas = await html2canvas(calRoot, {
      scale: 3,
      useCORS: true,
      backgroundColor: isLightExport ? '#f4f5f7' : '#12141f',
      width: 1080,
      logging: false,
      allowTaint: true,
    });

    document.body.removeChild(iframe);

    // Download
    const a = document.createElement('a');
    a.download = `班表_${state.year}_${String(state.month).padStart(2,'0')}_${store.name}.png`;
    a.href = canvas.toDataURL('image/png');
    a.click();

    toast.style.background = '#1a2e1e';
    toast.style.color = '#6fcf97';
    toast.textContent = `✅ ${store.name} 班表圖片已下載！`;
    setTimeout(() => toast.remove(), 2500);
  } catch(e) {
    document.body.removeChild(document.querySelector('iframe'));
    toast.style.color = '#ef5b5b';
    toast.textContent = `❌ 產生失敗：${e.message}`;
    setTimeout(() => toast.remove(), 3000);
    console.error(e);
  }
}

  applyTheme();
  render(); // render shell immediately
  await loadState();        // detect API availability first
  await loadWhoami();       // then load user (knows if fallback mode)
  render(); // re-render with real data
}

window.addEventListener('beforeunload', (e) => {
  if (_dirty || _saveTimer || _saving) {
    e.preventDefault();
    e.returnValue = '尚有變更未儲存至雲端，確定要離開嗎？';
  }
});

init();
